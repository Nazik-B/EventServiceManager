# Full system: infrastructure (Postgres x3, Zookeeper, Kafka, Redis) and the three services.
# Run everything: docker compose up -d --build
# Infrastructure only for local debugging: docker compose up -d events-db users-db bookings-db zookeeper kafka redis
x-jwt: &jwt
  Jwt__Secret: dev-only-secret-change-me-0123456789abcdef
  Jwt__Issuer: EventsApi
  Jwt__Audience: EventsApi.Clients
  Jwt__LifetimeMinutes: "60"
  ASPNETCORE_ENVIRONMENT: Development

services:
  events-db:
    image: postgres:16
    container_name: eventapi-events-db
    environment:
      POSTGRES_DB: events
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - events-db-data:/var/lib/postgresql/data
    healthcheck:
      # -h localhost: probe TCP, not the unix socket of the temporary init server
      test: ["CMD-SHELL", "pg_isready -h localhost -U postgres -d events"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  users-db:
    image: postgres:16
    container_name: eventapi-users-db
    environment:
      POSTGRES_DB: users
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - users-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U postgres -d users"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  bookings-db:
    image: postgres:16
    container_name: eventapi-bookings-db
    environment:
      POSTGRES_DB: bookings
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - bookings-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U postgres -d bookings"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: eventapi-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 2181 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: eventapi-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:29092 --list"]
      interval: 10s
      timeout: 10s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: eventapi-redis
    # Cache only: no persistence, bounded memory, evict least recently used keys.
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  users-service:
    build:
      context: .
      args:
        PROJECT: UsersService/UsersService.Presentation
    container_name: eventapi-users-service
    restart: on-failure
    depends_on:
      users-db:
        condition: service_healthy
    environment:
      <<: *jwt
      ConnectionStrings__DefaultConnection: Host=users-db;Port=5432;Database=users;Username=postgres;Password=postgres;GSS Encryption Mode=Disable
    ports:
      - "5003:8080"

  events-service:
    build:
      context: .
      args:
        PROJECT: EventsService/EventsService.Presentation
    container_name: eventapi-events-service
    restart: on-failure
    depends_on:
      events-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      <<: *jwt
      ConnectionStrings__DefaultConnection: Host=events-db;Port=5432;Database=events;Username=postgres;Password=postgres;GSS Encryption Mode=Disable
      ConnectionStrings__Redis: redis:6379,abortConnect=false
      Kafka__BootstrapServers: kafka:29092
      Kafka__ConsumerGroup: events-service
    ports:
      - "5001:8080"

  bookings-service:
    build:
      context: .
      args:
        PROJECT: BookingsService/BookingsService.Presentation
    container_name: eventapi-bookings-service
    restart: on-failure
    depends_on:
      bookings-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      <<: *jwt
      Kafka__BootstrapServers: kafka:29092
      ConnectionStrings__DefaultConnection: Host=bookings-db;Port=5432;Database=bookings;Username=postgres;Password=postgres;GSS Encryption Mode=Disable
    ports:
      - "5002:8080"

volumes:
  events-db-data:
  users-db-data:
  bookings-db-data: