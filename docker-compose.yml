# Local development infrastructure.
# Only events-db is used: the app connects to it on localhost:5432.
# Integration tests start their own Postgres via Testcontainers and do not need this file.
# Kafka, Zookeeper, users-db and bookings-db were removed as unused (see git history).
services:
  events-db:
    image: postgres:16
    container_name: eventapi-events-db
    environment:
      POSTGRES_DB: events
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - events-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  events-db-data:
